name: CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: ./
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Verify image (pull from GHCR)
        run: docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  update-infra:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Os manifests do comprasweb vivem no monorepo tools-infra
      # (tools/comprasweb). Secret TOOLS_INFRA_TOKEN: PAT fine-grained com
      # escrita SÓ no tools-infra (o mesmo nos repos de código de todos os apps).
      - name: Checkout tools-infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/tools-infra
          token: ${{ secrets.TOOLS_INFRA_TOKEN }}

      - name: Update image tag (tools/comprasweb/values.yaml)
        # yq (já vem no runner) em vez de sed: muda só
        # platform-chart.api.image.tag.
        run: |
          yq -i '.["platform-chart"].api.image.tag = "${{ github.ref_name }}"' tools/comprasweb/values.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/comprasweb/values.yaml
          git diff --cached --quiet && { echo "Tag já atualizada"; exit 0; }
          git commit -m "chore(comprasweb): atualizar tag da imagem para ${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push recusado (outro CD gravou no tools-infra); rebase e nova tentativa"
            git pull --rebase
          done
          exit 1
